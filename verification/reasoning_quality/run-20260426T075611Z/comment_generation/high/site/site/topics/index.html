</section></main><script>
(function(){
  var nav=document.querySelector('.site-root-menubar .site-space-nav');
  if(!nav){return;}
  function items(){
    return Array.prototype.slice.call(nav.querySelectorAll('.site-space-nav-item'));
  }
  function closeAll(exceptItem){
    items().forEach(function(item){
      if(item!==exceptItem){item.removeAttribute('open');}
    });
  }
  nav.addEventListener('toggle', function(event){
    var item=event.target;
    if(!item||!item.classList||!item.classList.contains('site-space-nav-item')){return;}
    if(item.hasAttribute('open')){closeAll(item);}
  }, true);
  document.addEventListener('pointerdown', function(event){
    if(nav.contains(event.target)){return;}
    closeAll(null);
  });
  document.addEventListener('keydown', function(event){
    if(event.key==='Escape'){closeAll(null);}
  });
})();
</script></body></html>
